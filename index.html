<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジョー｜柿川亭・アブララボ 経営ダッシュボード</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ジョー（会計係）">
<style>
  :root{
    --bg:#fcfcfb; --panel:#ffffff; --ink:#0b0b0b; --muted:#52514e; --line:rgba(11,11,11,.10);
    --kaki:#2a78d6; --abura:#eb6834;
    --good:#006300; --bad:#c0392b; --warn:#b8860b;
    --ch1:#2b9eb3; --ch2:#e0a32e; --ch3:#c1489b; --ch4:#3f9e5a;
    --accent:var(--kaki);
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1a19; --panel:#242422; --ink:#ffffff; --muted:#c3c2b7; --line:rgba(255,255,255,.12);
      --kaki:#3987e5; --abura:#d95926;
      --good:#0ca30c; --bad:#e34948; --warn:#e0b32e;
      --ch1:#38b7cd; --ch2:#e8b84a; --ch3:#d666af; --ch4:#57b874;
      --shadow:none;
    }
  }
  :root[data-theme="light"]{
    --bg:#fcfcfb; --panel:#ffffff; --ink:#0b0b0b; --muted:#52514e; --line:rgba(11,11,11,.10);
    --kaki:#2a78d6; --abura:#eb6834; --good:#006300; --bad:#c0392b; --warn:#b8860b;
    --ch1:#2b9eb3; --ch2:#e0a32e; --ch3:#c1489b; --ch4:#3f9e5a; --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"]{
    --bg:#1a1a19; --panel:#242422; --ink:#ffffff; --muted:#c3c2b7; --line:rgba(255,255,255,.12);
    --kaki:#3987e5; --abura:#d95926; --good:#0ca30c; --bad:#e34948; --warn:#e0b32e;
    --ch1:#38b7cd; --ch2:#e8b84a; --ch3:#d666af; --ch4:#57b874; --shadow:none;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{max-width:1120px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom,0px));}
  .tnum{font-variant-numeric:tabular-nums;}

  /* header */
  header{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:14px 2px 8px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:42px;height:42px;border-radius:12px;object-fit:contain;flex-shrink:0;padding:2px;
    background:radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--kaki) 14%, var(--panel)), var(--panel));
    border:1px solid var(--line);}
  .brand .titles{min-width:0;flex:1;}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:.02em;}
  .brand .sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .right{flex-shrink:0;display:flex;align-items:center;gap:8px;}
  .sync{font-size:11px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:4px;
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel);}
  .sync.spin .ic{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}

  /* filters */
  .filters{display:flex;flex-direction:column;gap:7px;margin:10px 0 4px;}
  .seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
  .seg::-webkit-scrollbar{display:none;}
  .seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .seg button.on{background:var(--accent);color:#fff;border-color:transparent;}
  .seg button.on[data-store="kaki"]{background:var(--kaki);}
  .seg button.on[data-store="abura"]{background:var(--abura);}

  /* layout */
  .grid{display:grid;gap:12px;margin-top:12px;}
  @media(min-width:760px){ .cols-2{grid-template-columns:1fr 1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;box-shadow:var(--shadow);}
  .card h2{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:10px;letter-spacing:.02em;}

  /* hero */
  .hero .label{font-size:13px;color:var(--muted);font-weight:700;}
  .hero .big{font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.05;margin:2px 0 2px;letter-spacing:-.01em;}
  .hero .big.pos{color:var(--good);} .hero .big.neg{color:var(--bad);}
  .delta{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
  .delta.up{color:var(--good);} .delta.down{color:var(--bad);} .delta.flat{color:var(--muted);}
  .hero .spark{margin-top:10px;}

  /* kpi cards */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(min-width:760px){ .kpis{grid-template-columns:repeat(4,1fr);} }
  .kpi .k-label{font-size:12px;color:var(--muted);font-weight:700;}
  .kpi .k-val{font-size:clamp(22px,6vw,27px);font-weight:800;margin:5px 0 4px;letter-spacing:-.01em;}
  .kpi .k-sub{font-size:11.5px;color:var(--muted);}
  .chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;
    padding:2px 8px;border-radius:999px;}
  .chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);}
  .chip.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);}

  /* channel bars */
  .ch-row{margin-bottom:12px;}
  .ch-row:last-child{margin-bottom:0;}
  .ch-head{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:5px;}
  .ch-dot{display:block;width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .ch-name{color:var(--muted);font-weight:700;}
  .ch-val{margin-left:auto;font-weight:800;white-space:nowrap;}
  .ch-pct{color:var(--muted);font-weight:600;font-size:11px;margin-left:5px;}
  .ch-track{height:10px;background:var(--line);border-radius:99px;overflow:hidden;}
  .ch-fill{display:block;height:100%;border-radius:99px;min-width:2px;}

  /* flash table */
  .flash{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
  .flash .f{display:flex;flex-direction:column;gap:2px;}
  .flash .f .l{font-size:11.5px;color:var(--muted);font-weight:700;}
  .flash .f .v{font-size:17px;font-weight:800;}

  /* ジョーの一言（数字連動リアクション） */
  .joe-greet{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-top:12px;}
  .joe-face{width:58px;height:58px;object-fit:contain;flex-shrink:0;}
  .joe-bubble{position:relative;flex:1;background:color-mix(in srgb,var(--accent) 9%, var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:10px 13px;font-size:13.5px;font-weight:700;line-height:1.5;}
  .joe-bubble::before{content:"";position:absolute;left:-7px;top:20px;border:7px solid transparent;border-right-color:var(--line);}
  .joe-bubble::after{content:"";position:absolute;left:-5px;top:20px;border:7px solid transparent;
    border-right-color:color-mix(in srgb,var(--accent) 9%, var(--panel));}
  .joe-bubble .note{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;line-height:1.7;}
  .loading{color:var(--muted);font-size:13px;padding:40px 0;text-align:center;}
  .err{color:var(--bad);font-size:12.5px;padding:14px;text-align:center;}
  svg{display:block;width:100%;overflow:visible;}
  .axis{fill:var(--muted);font-size:10px;} .gridline{stroke:var(--line);stroke-width:1;}

  /* 下部ナビ＋画面切替 */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:6px;
    background:color-mix(in srgb,var(--panel) 92%, transparent);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));}
  .bottomnav button{flex:0 1 180px;background:none;border:0;color:var(--muted);font-family:inherit;font-weight:700;
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;border-radius:10px;}
  .bottomnav button .ic{font-size:19px;line-height:1;}
  .bottomnav button.on{color:var(--accent);}
  /* コスト画面 */
  .cost-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(min-width:760px){ .cost-sum{grid-template-columns:repeat(4,1fr);} }
  .cost-sum .cs{background:color-mix(in srgb,var(--accent) 5%, var(--panel));border:1px solid var(--line);border-radius:11px;padding:11px 12px;}
  .cost-sum .cs .l{font-size:11.5px;color:var(--muted);font-weight:700;}
  .cost-sum .cs .v{font-size:21px;font-weight:800;margin-top:4px;}
  .cost-sum .cs .v.pos{color:var(--good);} .cost-sum .cs .v.neg{color:var(--bad);}
  .stack{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:8px;}
  .stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;min-width:2px;}
  .stack-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);font-weight:700;}
  .stack-legend .lg{display:flex;align-items:center;gap:6px;} .stack-legend .d{width:11px;height:11px;border-radius:3px;}
  .rank-row{margin-bottom:11px;} .rank-row:last-child{margin-bottom:0;}
  .rank-head{display:flex;font-size:12.5px;margin-bottom:4px;gap:8px;}
  .rank-name{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-val{margin-left:auto;font-weight:800;white-space:nowrap;flex-shrink:0;}
  .rank-track{height:9px;background:var(--line);border-radius:99px;overflow:hidden;}
  .rank-fill{display:block;height:100%;border-radius:99px;background:var(--accent);min-width:2px;}
  .empty-note{color:var(--muted);font-size:12.5px;padding:6px 0;line-height:1.6;}
  /* 店舗一覧 */
  .strow{padding:12px 2px;border-bottom:1px solid var(--line);}
  .strow:last-child{border-bottom:0;}
  .stname{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .stbadge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;}
  .stbadge.chok{background:color-mix(in srgb,var(--accent) 16%, var(--panel));color:var(--accent);}
  .stbadge.fc{background:var(--line);color:var(--muted);}
  .sttot{font-size:24px;font-weight:800;margin-top:3px;}
  .stsub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
  .stwarn{color:var(--bad);font-weight:800;}
  .stgrand{border-top:2px solid var(--line);border-bottom:0;display:flex;align-items:center;justify-content:space-between;margin-top:4px;padding-top:12px;}
  .stgrand .stname{font-size:15px;} .stgrand .sttot{margin-top:0;}
  .strow.clk{cursor:pointer;} .strow.clk:active{opacity:.6;}
  .stchev{margin-left:auto;color:var(--muted);font-weight:800;font-size:18px;}
  .backbtn{background:var(--line);border:0;color:var(--ink);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;padding:9px 16px;border-radius:99px;margin-bottom:12px;}
  .backbtn:active{opacity:.6;}
  .seg{display:inline-flex;background:var(--line);border-radius:99px;padding:3px;margin-bottom:12px;}
  .seg button{border:0;background:none;font-family:inherit;font-weight:800;font-size:13px;color:var(--muted);padding:7px 20px;border-radius:99px;cursor:pointer;}
  .seg button.on{background:var(--panel);color:var(--accent);}
  .daynav{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 2px;}
  .daynav .arw{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:22px;font-weight:800;color:var(--accent);cursor:pointer;}
  .daynav .arw:disabled{color:var(--line);cursor:default;}
  .daynav .dlab{font-size:18px;font-weight:800;min-width:150px;text-align:center;}
  .todaybtn{display:block;margin:2px auto 4px;background:none;border:0;color:var(--accent);font-weight:800;font-size:12px;cursor:pointer;}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .dayrow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);}
  .dayrow:last-child{border-bottom:0;}
  .dayrow .n{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;}
  .dayrow .v{font-weight:800;font-size:18px;} .dayrow .v.none{color:var(--muted);font-weight:600;font-size:13px;}
  .dvals{margin-top:10px;} .dv-row{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px;} .dv-row:last-child{border-bottom:0;} .dv-row b{font-weight:800;font-size:17px;}
  .sd-delta{font-size:13px;font-weight:800;} .sd-delta.pos{color:var(--good);} .sd-delta.neg{color:var(--bad);}
  .sd-split{display:flex;gap:12px;margin-top:6px;} .sd-split .b{flex:1;background:color-mix(in srgb,var(--accent) 5%, var(--panel));border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
  .sd-split .l{font-size:11.5px;color:var(--muted);font-weight:700;} .sd-split .v{font-size:19px;font-weight:800;margin-top:3px;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" src="assets/joe.png" alt="ジョー">
    <div class="titles">
      <h1>ジョー（会計係）</h1>
      <div class="sub">柿川亭・アブララボ 経営ダッシュボード</div>
    </div>
    <div class="right">
      <div class="sync" id="sync"><span class="ic">⟳</span><span id="sync-t">同期中…</span></div>
      <button class="iconbtn" id="theme" title="表示切替">◐</button>
    </div>
  </div>
  <div class="filters">
    <div class="seg" id="seg-period">
      <button data-period="today">今日</button>
      <button data-period="week">今週</button>
      <button data-period="month" class="on">今月</button>
      <button data-period="prev">先月</button>
    </div>
    <div class="seg" id="seg-store">
      <button data-store="all" class="on">全店</button>
      <button data-store="kaki">柿川亭</button>
      <button data-store="abura">アブララボ</button>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading" id="loading">📊 データを読み込んでいます…</div>
  <div id="content" style="display:none;">
   <div id="screen-home">
    <!-- ジョーの一言 -->
    <div class="card joe-greet">
      <img class="joe-face" id="joe-face" src="assets/joe.png" alt="ジョー">
      <div class="joe-bubble" id="joe-say">…</div>
    </div>
    <!-- hero -->
    <div class="grid">
      <div class="card hero">
        <div class="label" id="hero-label">今月の簡易利益</div>
        <div class="big" id="hero-val">¥—</div>
        <div><span class="delta" id="hero-delta"></span></div>
        <div class="spark" id="hero-spark"></div>
      </div>
    </div>
    <!-- kpis -->
    <div class="kpis" style="margin-top:12px;">
      <div class="card kpi"><div class="k-label" id="k1-l">今月 売上</div><div class="k-val" id="k1-v">—</div><div class="k-sub" id="k1-s"></div></div>
      <div class="card kpi"><div class="k-label" id="k2-l">今月 客数</div><div class="k-val" id="k2-v">—</div><div class="k-sub" id="k2-s"></div></div>
      <div class="card kpi"><div class="k-label" id="k3-l">客単価</div><div class="k-val" id="k3-v">—</div><div class="k-sub" id="k3-s"></div></div>
      <div class="card kpi"><div class="k-label" id="k4-l">今月 総経費率</div><div class="k-val" id="k4-v">—</div><div class="k-sub" id="k4-s"></div></div>
    </div>
    <!-- trend + channel -->
    <div class="grid cols-2">
      <div class="card">
        <h2>日次売上推移（今月）</h2>
        <div id="trend"></div>
      </div>
      <div class="card">
        <h2>チャネル構成（今月）</h2>
        <div id="channel"></div>
      </div>
    </div>
    <!-- 曜日別 -->
    <div class="grid">
      <div class="card">
        <h2>曜日別の平均売上（今月）</h2>
        <div id="dow"></div>
      </div>
    </div>
    <!-- flash -->
    <div class="grid">
      <div class="card">
        <h2 id="flash-h">最新日の速報</h2>
        <div class="flash" id="flash"></div>
      </div>
    </div>
    <div class="foot" id="foot"></div>
   </div><!-- /screen-home -->

   <div id="screen-cost" style="display:none;">
    <div class="card"><h2>今月の損益（<span id="cost-store">全店</span>）</h2><div class="cost-sum" id="cost-summary"></div></div>
    <div class="card"><h2>経費の内訳（仕入 vs 人件費）</h2><div id="cost-breakdown"></div></div>
    <div class="card"><h2>仕入先・費目 別ランキング（税込）</h2><div id="cost-vendors"></div></div>
    <div class="card"><h2>人件費</h2><div id="cost-labor"></div></div>
    <div class="foot" id="foot2"></div>
   </div><!-- /screen-cost -->

   <div id="screen-stores" style="display:none;">
    <div class="card"><h2>店舗別 当月売上一覧 <span id="stores-sub" style="font-weight:500;font-size:13px;color:var(--sub)"></span></h2>
      <div id="store-list"><div class="foot">読み込み中…</div></div>
    </div>
    <div class="foot" id="foot3"></div>
   </div><!-- /screen-stores -->

   <div id="screen-storedetail" style="display:none;">
    <button class="backbtn" onclick="showScreen('stores')">‹ 店舗一覧へ</button>
    <div id="storedetail"><div class="foot">読み込み中…</div></div>
    <div class="foot" id="foot4"></div>
   </div><!-- /screen-storedetail -->
  </div>
  <div class="err" id="err" style="display:none;"></div>
</main>
<nav class="bottomnav" id="bottomnav">
  <button data-screen="home" class="on"><span class="ic">🏠</span>ホーム</button>
  <button data-screen="cost"><span class="ic">💰</span>コスト・利益</button>
  <button data-screen="stores"><span class="ic">🏬</span>店舗</button>
</nav>

<script>
/* ===== 設定：月ごとにシートが変わる想定。新しい月はここに1行足すだけ ===== */
var SHEETS = [
  { ym:"2026-07", label:"2026年7月", id:"1cMfvuwBRc6tnKoeIPAgM5wGryUXyeV5fL2XPkoIcTT8" }
];
var CURRENT = SHEETS[SHEETS.length-1];               // 表示対象＝最新月
var PREV = SHEETS.length>=2 ? SHEETS[SHEETS.length-2] : null;
var LS_KEY = "joe_cache_v1";
var POLL_MS = 5*60*1000;
// タブ名（Codexが入力UX改善で絵文字付きに改名したのに合わせる。※名前が変わったらここだけ直せばよい）
var TABS = {
  kaki:   "🍜日次：柿川亭",
  abura:  "🧴日次：アブララボ",
  monthly:"月次集計",
  shiire: "🧾仕入経費",
  jinken: "👤人件費"
};

/* ===== 店舗レジストリ（店舗別売上一覧）＝追加はここに1行 =====
   直営(joe)＝既存の日次タブを再利用。FC/仙台(col)＝店ごとの不規則シートを
   「当年の列でデータがある一番右＝当月」ロジックで自動検出（仙台のように当年データ空なら0＝誤表示防止）。*/
/* sub2 = 2つ目の内訳の呼び名。直営(joe)のanydeli列は「デリバリー」ではなく
   キャッシュレス決済の売上（masa 2026-08-01 指摘）。FC/仙台の2枚目タブは本当にデリバリー。 */
var STORES = [

  { id:"abura",     name:"アブララボ",       kind:"直営", adapter:"joe", tab:TABS.abura, sub2:"キャッシュレス" },

  { id:"fukushima", name:"柿川亭 福島店",     kind:"FC",  adapter:"col", sheetId:"1jJQLbO2GuMKcL14QEBhb3mjidrNCxyah5Oq9pyp8y_s", storeTab:"日報（券売機）", deliveryTab:"デリバリー", sub2:"デリバリー" },
  { id:"hakusan",   name:"柿川亭 白山市場店", kind:"FC",  adapter:"col", sheetId:"1htLUtSiJQ3qzJIGzAfmFaKuUYskR26vK4GGj_V5_r-A", storeTab:"シート1", deliveryTab:"Uber", sub2:"デリバリー" },
  { id:"shindaimae",name:"柿川亭 新大前店",   kind:"FC",  adapter:"col", sheetId:"1SQgMCEIDqgMtoHSUnnOxS8DRZqY_4oMoRX-Vo4LWH-M", storeTab:"2026年1月〜2026年12月売上", sub2:"デリバリー" }

/* ===== ユーティリティ ===== */
function gvizUrl(id, tab){ return "https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(tab); }
function num(s){ if(s==null) return 0; s=(""+s).replace(/[^0-9.\-]/g,""); var v=parseFloat(s); return isNaN(v)?0:v; }
function yen(v){ return "¥"+Math.round(v).toLocaleString("ja-JP"); }
function ppl(v){ return Math.round(v).toLocaleString("ja-JP")+"人"; }
/* 簡易CSVパーサ（ダブルクオート対応） */
function parseCSV(text){
  var rows=[], row=[], f="", i=0, q=false, c;
  while(i<text.length){ c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"') q=true; else if(c===',') {row.push(f);f="";} else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c==='\r'){} else f+=c; }
    i++;
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function colIdx(header, name){ for(var i=0;i<header.length;i++){ if((header[i]||"").indexOf(name)>=0) return i; } return -1; }

/* ===== gviz取得（全タブ） ===== */
function fetchTab(id, tab){
  return fetch(gvizUrl(id,tab)).then(function(r){ if(!r.ok) throw new Error(tab+" "+r.status); return r.text(); }).then(parseCSV);
}
function fetchMonth(sheet){
  return Promise.all([
    fetchTab(sheet.id,TABS.kaki),
    fetchTab(sheet.id,TABS.abura),
    fetchTab(sheet.id,TABS.monthly),
    fetchTab(sheet.id,TABS.shiire).catch(function(){return[];}),
    fetchTab(sheet.id,TABS.jinken).catch(function(){return[];})
  ]).then(function(a){
    /* 台帳は月ごとに中身が入れ替わる（8月になれば8月分になる）。
       設定に書いた ym を信じず、日次タブの実データから何月分かを判定する。
       ※以前は "2026年7月" が固定表示で、月が変わっても7月のままだった。 */
    var ym=sheet.ym, label=sheet.label, seen=ymFromRows(a[0])||ymFromRows(a[1]);
    if(seen){ ym=seen; label=(+seen.slice(0,4))+"年"+(+seen.slice(5,7))+"月"; }
    return { ym:ym, label:label, kaki:a[0], abura:a[1], monthly:a[2], shiire:a[3], jinken:a[4] };
  });
}
/* 日次タブの行から「何年何月分か」を拾う（一番新しい日付の月） */
function ymFromRows(rows){
  var best="";
  (rows||[]).forEach(function(r){
    var d=((r&&r[0])||"").trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(d) && d>best) best=d;
  });
  return best?best.slice(0,7):"";
}
/* 仕入経費パース → [{date,store,vendor,zeikomi}] */
function parseShiire(rows){
  if(!rows||!rows.length) return [];
  var h=rows[0];
  var iSt=colIdx(h,"店舗"), iVen=colIdx(h,"仕入先"), iZk=colIdx(h,"税込金額");
  var out=[];
  for(var r=1;r<rows.length;r++){ var row=rows[r]; var d=(row[0]||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    out.push({ date:d, store:(row[iSt]||"").trim(), vendor:(row[iVen]||"その他").trim(), zeikomi:num(row[iZk]) });
  }
  return out;
}
/* 人件費パース → [{date,store,name,hours,cost}] */
function parseJinken(rows){
  if(!rows||!rows.length) return [];
  // ヘッダー行を探す（「氏名」を含む行）
  var hi=-1; for(var i=0;i<rows.length;i++){ if((rows[i]||[]).some(function(c){return (c||"").indexOf("氏名")>=0;})){ hi=i; break; } }
  if(hi<0) return [];
  var h=rows[hi], iSt=colIdx(h,"店舗"), iNm=colIdx(h,"氏名"), iHr=colIdx(h,"勤務時間");
  // 「人件費」列は先頭見出し「人件費入力（…）日付」に誤ヒットしやすいので、完全一致を末尾側から優先で探す
  var iCost=-1; for(var ci=h.length-1;ci>=0;ci--){ if((h[ci]||"").trim()==="人件費"){ iCost=ci; break; } }
  if(iCost<0) iCost=colIdx(h,"人件費");
  var out=[];
  for(var r=hi+1;r<rows.length;r++){ var row=rows[r]; var d=(row[0]||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    out.push({ date:d, store:(row[iSt]||"").trim(), name:(row[iNm]||"").trim(), hours:num(row[iHr]), cost:num(row[iCost]) });
  }
  return out;
}

/* ===== 日次パース → [{date,dow,kenbai,anydeli,coupon,tsuhan,uriage,kyaku}] =====
   日次シートは列順が固定（0日付/1曜日/2券売機売上/3anydeli売上/4クーポン枚数/5クーポン売上/
   6通販・その他/7売上合計/8券売機杯数/9anydeli換算/10クーポン換算/11推定来店客数…）。
   シート改善で見出し行が多重ラベル化して名前検出が壊れたため、固定列インデックスで読む。
   日付でない行（見出し・月次小計）はスキップ。逆順で入っていても昇順に並べ直す。 */
function parseDaily(rows){
  if(!rows||!rows.length) return [];
  var out=[];
  for(var r=1;r<rows.length;r++){
    var row=rows[r]; var d=(row[0]||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    out.push({
      date:d, dow:(row[1]||"").trim(),
      kenbai:num(row[2]), anydeli:num(row[3]), coupon:num(row[5]), tsuhan:num(row[6]),
      uriage:num(row[7]), kyaku:num(row[11])
    });
  }
  out.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  return out;
}
/* 月次集計パース → {label:{kaki,abura,all}} */
function parseMonthly(rows){
  var m={};
  for(var r=0;r<rows.length;r++){ var row=rows[r]; var k=(row[0]||"").trim(); if(!k) continue;
    m[k]={ kaki:num(row[1]), abura:num(row[2]), all:num(row[3]) }; }
  function find(sub){ for(var key in m){ if(key.indexOf("◀前月")<0 && key.indexOf(sub)>=0) return m[key]; } return {kaki:0,abura:0,all:0}; }
  /* ◀前月 行（v3台帳がビルド時に前月の確定値を書き込む）。無い台帳では prev.has=false */
  function findPrev(sub){ for(var key in m){ if(key.indexOf("◀前月")===0 && key.indexOf(sub)>=0) return m[key]; } return null; }
  var pU=findPrev("売上合計"), pR=findPrev("簡易利益"), pS=findPrev("仕入"), pJ=findPrev("人件費");
  var pYm=""; for(var key2 in m){ var mt=key2.match(/^◀前月実績（([^）]+)）/); if(mt){ pYm=mt[1]; break; } }
  return {
    shiire:find("仕入"), jinken:find("人件費"), sokei:find("総経費"),
    rieki:find("簡易利益"), uriageM:find("売上合計"), kyakuM:find("推定来店"),
    prev:{ has:!!(pU||pR), uriage:pU||{kaki:0,abura:0,all:0}, rieki:pR||{kaki:0,abura:0,all:0},
           shiire:pS||null, jinken:pJ||null, ym:pYm }
  };
}

/* ===== 集計 ===== */
function mergeDaily(kaki, abura){
  var map={};
  function add(list){ list.forEach(function(x){ var t=map[x.date]||(map[x.date]={date:x.date,dow:x.dow,kenbai:0,anydeli:0,coupon:0,tsuhan:0,uriage:0,kyaku:0});
    t.kenbai+=x.kenbai;t.anydeli+=x.anydeli;t.coupon+=x.coupon;t.tsuhan+=x.tsuhan;t.uriage+=x.uriage;t.kyaku+=x.kyaku; }); }
  add(kaki); add(abura);
  return Object.keys(map).sort().map(function(k){return map[k];});
}
function sumRange(daily, keys){ var o={}; keys.forEach(function(k){o[k]=0;}); daily.forEach(function(d){ keys.forEach(function(k){o[k]+=d[k];}); }); return o; }

/* ===== 状態 ===== */
var STORE="all", PERIOD="month", SCREEN="home", DATA=null;
var STORE_LABEL={all:"全店",kaki:"柿川亭",abura:"アブララボ"};
function shiireFor(store){ var l=parseShiire(DATA.shiire); return store==="all"?l:l.filter(function(x){return x.store===STORE_LABEL[store];}); }
function jinkenFor(store){ var l=parseJinken(DATA.jinken); return store==="all"?l:l.filter(function(x){return x.store===STORE_LABEL[store];}); }

function dailyFor(store){
  if(store==="kaki") return parseDaily(DATA.kaki);
  if(store==="abura") return parseDaily(DATA.abura);
  return mergeDaily(parseDaily(DATA.kaki), parseDaily(DATA.abura));
}
function monthlyFor(store){
  /* v3: 月次集計タブの行ラベルに依存せず、仕入・人件費・日次の各タブから直接計算する。
     旧実装は「簡易利益」行を読んでいたが、その行は合計列にしか値が無く、
     柿川亭/アブララボ単体で利益が¥0になるバグがあった（masa指摘 2026-08-01）。 */
  var ym = DATA.ym || "";
  var inYm = function(x){ return ym && (x.date||"").indexOf(ym)===0; };
  var shiire = shiireFor(store).filter(inYm).reduce(function(s,x){ return s + (x.zeikomi||0); }, 0);
  var jinken = jinkenFor(store).filter(inYm).reduce(function(s,x){ return s + (x.cost||0); }, 0);
  var uriage = sumRange(dailyFor(store),["uriage"]).uriage;
  var sokei = shiire + jinken;
  var rieki = uriage - sokei;
  /* 前月比の材料（台帳の「◀前月」行。v3台帳のみ） */
  var m=parseMonthly(DATA.monthly);
  var pick=function(o){ return store==="kaki"?o.kaki:store==="abura"?o.abura:o.all; };
  var prev = (m.prev && m.prev.has) ? { uriage:pick(m.prev.uriage), rieki:pick(m.prev.rieki) } : null;
  return { shiire:shiire, jinken:jinken, sokei:sokei, rieki:rieki, uriage:uriage, prev:prev };
}
function periodRows(daily){
  var withData = daily.filter(function(d){ return d.uriage>0 || d.kyaku>0; });
  if(PERIOD==="month") return daily;
  if(!withData.length) return [];
  var last = withData[withData.length-1].date;
  if(PERIOD==="today") return daily.filter(function(d){ return d.date===last; });
  /* week = 最新データ日から直近7日 */
  var end=new Date(last); var start=new Date(end); start.setDate(start.getDate()-6);
  return daily.filter(function(d){ var t=new Date(d.date); return t>=start && t<=end; });
}

/* ===== 描画 ===== */
function elt(id){return document.getElementById(id);}
function setDelta(el, prev, cur){
  /* prev = {rieki:前月の簡易利益} が台帳の◀前月行から取れたときだけ実比較を出す */
  if(prev && isFinite(prev.rieki) && Math.abs(prev.rieki)>0){
    var diff=cur-prev.rieki, pct=Math.round(diff/Math.abs(prev.rieki)*100);
    el.className="delta "+(diff>=0?"up":"down");
    el.textContent="前月比 "+(diff>=0?"+":"")+pct+"%（前月 "+yen(prev.rieki)+"）";
  } else {
    el.className="delta flat"; el.textContent="前月比 —";
  }
}

/* 曜日別 平均売上 */
function renderDow(daily){
  var order=["月","火","水","木","金","土","日"];
  var agg={}; order.forEach(function(d){agg[d]={sum:0,n:0};});
  daily.forEach(function(d){ if((d.uriage>0)&&agg[d.dow]){ agg[d.dow].sum+=d.uriage; agg[d.dow].n++; } });
  var vals=order.map(function(d){ return agg[d].n?agg[d].sum/agg[d].n:0; });
  var mx=Math.max.apply(null,vals.concat([1]));
  var W=520,H=150,pad={l:6,r:6,t:10,b:22}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var bw=iw/order.length*0.62, gap=iw/order.length;
  var bars=order.map(function(d,i){
    var v=vals[i], h=v/mx*ih, x=pad.l+i*gap+(gap-bw)/2, y=pad.t+ih-h;
    var wk=(d==="土"||d==="日");
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="3" fill="var(--accent)" opacity="'+(wk?1:0.55)+'"/>'+
      '<text class="axis" x="'+(x+bw/2).toFixed(1)+'" y="'+(pad.t+ih+15)+'" text-anchor="middle">'+d+'</text>'+

/* タブ名検証つき取得（out:htmlの<title>で実タブ名を確認。CORS等で取れない時はcsvにフォールバック。名前不一致が確定した時だけ拒否） */

/* 列＝月のシートから「当年でデータがある一番右の列」を当月として集計 */
function colTotals(rows){
  if(!rows||!rows.length) return {col:-1,byDay:{},sum:0,days:0,latest:0};
  var ncol=0; rows.forEach(function(r){ if(r.length>ncol) ncol=r.length; });
  var yr=-1; for(var i=0;i<Math.min(3,rows.length);i++){ for(var c=0;c<(rows[i]||[]).length;c++){ if(/20\d\d/.test(rows[i][c]||"")){ yr=i; break; } } if(yr>=0) break; }
  var years=[], last=0;
  for(var c=0;c<ncol;c++){ var cell=yr>=0?(rows[yr][c]||""):""; var mm=(""+cell).match(/20\d\d/); if(mm) last=parseInt(mm[0],10); years[c]=last; }
  var year=new Date().getFullYear(), best=-1;
  for(var c=1;c<ncol;c++){ if(years[c]!==year) continue; var has=false;
    for(var r=0;r<rows.length;r++){ var d=num(rows[r][0]); if(d>=1&&d<=31 && (""+(rows[r][c]||"")).trim()!==""){ has=true; break; } }
    if(has) best=c; }
  var byDay={}, sum=0, days=0, latest=0;
  if(best>=0){ for(var r=0;r<rows.length;r++){ var d=num(rows[r][0]); if(d>=1&&d<=31 && (""+(rows[r][best]||"")).trim()!==""){ var v=num(rows[r][best]); byDay[d]=v; sum+=v; days++; if(d>latest) latest=d; } } }
  return {col:best,byDay:byDay,sum:sum,days:days,latest:latest};
}
/* 当年でデータのある列を左→右で全部返す（当月＝最後・前月＝最後から2番目） */
function colSeries(rows){
  if(!rows||!rows.length) return [];
  var ncol=0; rows.forEach(function(r){ if(r.length>ncol) ncol=r.length; });
  var yr=-1; for(var i=0;i<Math.min(3,rows.length);i++){ for(var c=0;c<(rows[i]||[]).length;c++){ if(/20\d\d/.test(rows[i][c]||"")){ yr=i; break; } } if(yr>=0) break; }
  var years=[], last=0;
  for(var c=0;c<ncol;c++){ var cell=yr>=0?(rows[yr][c]||""):""; var mm=(""+cell).match(/20\d\d/); if(mm) last=parseInt(mm[0],10); years[c]=last; }
  var year=new Date().getFullYear(), out=[];
  for(var c=1;c<ncol;c++){ if(years[c]!==year) continue;
    var byDay={}, sum=0, latest=0, days=0;
    for(var r=0;r<rows.length;r++){ var d=num(rows[r][0]); if(d>=1&&d<=31 && (""+(rows[r][c]||"")).trim()!==""){ var v=num(rows[r][c]); byDay[d]=v; sum+=v; days++; if(d>latest) latest=d; } }
    if(days>0) out.push({col:c,byDay:byDay,sum:sum,latest:latest,days:days,ym:colYm(rows,c,years[c])});
  }
  return out;
}
/* 列見出しから「何年何月の列か」を拾う（"2026年7月" / "7月" 等）。取れなければnull */
function colYm(rows, c, year){
  for(var i=0;i<Math.min(4,rows.length);i++){
    var t=""+(((rows[i]||[])[c])||"");
    var m=t.match(/(\d{1,2})\s*月/);
    if(m){ var mo=parseInt(m[1],10); if(mo>=1&&mo<=12) return (year||new Date().getFullYear())+"-"+("0"+mo).slice(-2); }
  }
  return null;
}
function summarizeDays(days){
  var storeTotal=0,delivTotal=0,latestDay=0,latestTotal=0;
  days.forEach(function(x){ storeTotal+=x.store; delivTotal+=x.deliv; if(x.total>0 && x.day>latestDay){ latestDay=x.day; latestTotal=x.total; } });
  var total=storeTotal+delivTotal;
  return { total:total, storeTotal:storeTotal, delivTotal:delivTotal, daysCount:days.length, latestDay:latestDay, latestTotal:latestTotal, noData:total<=0 };
}
function fetchStoreDetail(store){
  if(store.adapter==="joe"){
    return fetchTab(CURRENT.id, store.tab).then(parseDaily).then(function(days){
      var arr=days.map(function(d){ return {day:parseInt(d.date.slice(8),10), store:d.uriage-d.anydeli, deliv:d.anydeli, total:d.uriage}; }).filter(function(x){return x.total>0;});
      var s=summarizeDays(arr); s.name=store.name; s.kind=store.kind; s.days=arr; s.prevTotal=null;
      /* 台帳シートは「2026-07」のように月別。データの実日付から何月分かを持たせる */
      s.ym = days.length ? days[days.length-1].date.slice(0,7) : null;
      /* 前月比: 台帳の◀前月行（ホーム読込済みのDATAがあれば） */
      try{
        if(DATA && DATA.monthly){ var mp=parseMonthly(DATA.monthly);
          if(mp.prev && mp.prev.has) s.prevTotal = (store.id==="kaki") ? mp.prev.uriage.kaki : mp.prev.uriage.abura; }
      }catch(e){}
      return s;
    });
  }
  var jobs=[ fetchTab(store.sheetId, store.storeTab) ];
  jobs.push(store.deliveryTab ? fetchTab(store.sheetId, store.deliveryTab).catch(function(){return null;}) : Promise.resolve(null));
  return Promise.all(jobs).then(function(res){
    var ss=colSeries(res[0]), ds=(res[1]&&res[1].length)?colSeries(res[1]):[];
    var curS=ss.length?ss[ss.length-1]:null, prevS=ss.length>=2?ss[ss.length-2]:null;
    var curD=ds.length?ds[ds.length-1]:null, prevD=ds.length>=2?ds[ds.length-2]:null;
    var dm={};
    if(curS) for(var d in curS.byDay){ (dm[d]=dm[d]||{store:0,deliv:0}).store=curS.byDay[d]; }
    if(curD) for(var d in curD.byDay){ (dm[d]=dm[d]||{store:0,deliv:0}).deliv=curD.byDay[d]; }
    var arr=Object.keys(dm).map(function(d){ return {day:+d, store:dm[d].store||0, deliv:dm[d].deliv||0, total:(dm[d].store||0)+(dm[d].deliv||0)}; }).sort(function(a,b){return a.day-b.day;});
    var s=summarizeDays(arr); s.name=store.name; s.kind=store.kind; s.days=arr;
    s.prevTotal=(prevS||prevD)?((prevS?prevS.sum:0)+(prevD?prevD.sum:0)):null;
    s.ym=(curS&&curS.ym)||(curD&&curD.ym)||null;
    return s;
  });
}

  var bound=dayBound(r.ym, r.latestDay), sub2=store.sub2||"デリバリー", per=ymText(r.ym);
  if(STOREDETAIL_DAY==null) STOREDETAIL_DAY = r.latestDay||bound;
  var badge='<span class="stbadge '+(store.kind==="FC"?"fc":"chok")+'">'+store.kind+'</span>';
  var back='<button class="backbtn" onclick="showScreen(\'stores\')">‹ 店舗一覧へ</button>';
  var delta = (r.prevTotal!=null&&r.prevTotal>0)
    ? ('<span class="sd-delta '+((r.total-r.prevTotal)>=0?"pos":"neg")+'">前月比 '+((r.total-r.prevTotal)>=0?"+":"")+Math.round((r.total-r.prevTotal)/r.prevTotal*100)+'%（前月 '+yen(r.prevTotal)+'）</span>')
    : '<span class="stsub">前月データなし</span>';
  var split='<div class="sd-split"><div class="b"><div class="l">店舗売上</div><div class="v">'+yen(r.storeTotal)+'</div></div><div class="b"><div class="l">'+sub2+'</div><div class="v">'+yen(r.delivTotal)+'</div></div></div>';
  var period=per?('<div class="stsub" style="margin-top:2px">'+per+'分'+(isCurMonth(r.ym)?'':'（当月のデータはまだありません）')+'</div>'):'';
  var head='<div class="card"><h2 style="font-size:21px;margin-bottom:2px">'+r.name+' '+badge+'</h2>'+period+'<div class="sttot" style="font-size:30px">'+yen(r.total)+'</div><div style="margin-top:4px">'+delta+'</div>'+split+'</div>';
  var it=null; (r.days||[]).forEach(function(x){ if(x.day===STOREDETAIL_DAY) it=x; });
  var dvals = (it&&it.total>0)
    ? ('<div class="dv-row"><span>合計</span><b>'+yen(it.total)+'</b></div><div class="dv-row"><span>店舗売上</span><b>'+yen(it.store)+'</b></div><div class="dv-row"><span>'+sub2+'</span><b>'+yen(it.deliv)+'</b></div>')
    : '<div class="empty-note" style="text-align:center;padding:14px 0">この日は入力がありません</div>';
  var dayCard='<div class="card"><h2>日別の金額</h2>'+dayNavHtml(STOREDETAIL_DAY, bound, "stepDetailDay", r.ym)+'<div class="dvals">'+dvals+'</div></div>';
  var chart=(r.days&&r.days.length)?('<div class="card"><h2>日別売上の推移（'+(per||"今月")+'）</h2>'+storeDayChart(r.days)+'<div class="stack-legend" style="margin-top:6px"><span class="lg"><span class="d" style="background:var(--accent)"></span>店舗</span><span class="lg"><span class="d" style="background:var(--ch2)"></span>'+sub2+'</span></div></div>'):'';
  elt("storedetail").innerHTML = back + storeChipsHtml(store.id) + head + dayCard + chart;
}
function stepDetailDay(delta){
  var r=STORE_DETAILS[STOREDETAIL_ID]||{}; var bound=dayBound(r.ym, r.latestDay);
  STOREDETAIL_DAY=(delta===0)?bound:Math.max(1,Math.min(bound,(STOREDETAIL_DAY||bound)+delta));
  var st=null; STORES.forEach(function(s){ if(s.id===STOREDETAIL_ID)st=s; });
  if(st&&STORE_DETAILS[STOREDETAIL_ID]) renderStoreDetailInner(st, STORE_DETAILS[STOREDETAIL_ID]);
}
function showStoreDetail(id, day){
  var store=null; STORES.forEach(function(s){ if(s.id===id) store=s; }); if(!store) return;
  SCREEN="storedetail"; STOREDETAIL_ID=id; STOREDETAIL_DAY=(day!=null?day:null);
  elt("screen-home").style.display="none"; elt("screen-cost").style.display="none"; elt("screen-stores").style.display="none"; elt("screen-storedetail").style.display="block";
  [].forEach.call(document.getElementById("bottomnav").children,function(b){ b.classList.toggle("on", b.dataset.screen==="stores"); });
  window.scrollTo(0,0);
  if(STORE_DETAILS[id]) renderStoreDetailInner(store, STORE_DETAILS[id]);
  else elt("storedetail").innerHTML='<div class="foot">読み込み中…</div>';
  fetchStoreDetail(store).then(function(r){ STORE_DETAILS[id]=r; try{localStorage.setItem(STORE_CACHE_KEY,JSON.stringify(STORE_DETAILS));}catch(e){} if(SCREEN==="storedetail"&&STOREDETAIL_ID===id) renderStoreDetailInner(store,r); })
    .catch(function(e){ if(!STORE_DETAILS[id]) elt("storedetail").innerHTML='<div class="card"><div class="empty-note">読み込みに失敗しました。'+(""+e)+'</div></div>'; });
}
function showScreen(name){
  SCREEN=name;
  elt("screen-home").style.display = name==="home"?"block":"none";
  elt("screen-cost").style.display = name==="cost"?"block":"none";
  elt("screen-stores").style.display = name==="stores"?"block":"none";
  var sd=elt("screen-storedetail"); if(sd) sd.style.display="none";
  if(name==="stores") renderStores(false);
  [].forEach.call(document.getElementById("bottomnav").children,function(b){ b.classList.toggle("on", b.dataset.screen===name); });
  window.scrollTo(0,0);
}

function joeReact(rieki, uriage, jinken){
  var face="joe", say="";
  if(uriage<=0){ face="joe"; say="このお店は今月のデータがまだ無いみたい。入力されたらここで一緒に見ていこう。"; }
  else if(rieki<0){ face="joe_worry"; say="今月は赤字…。どこを締められるか一緒に見ていこう。"; }
  else {
    var m = rieki/uriage*100;
    if(m>=40){ face="joe_glad"; say="絶好調！利益しっかり出てるよ🎉 この調子でいこう！"; }
    else if(m>=15){ face="joe_happy"; say="今月は黒字、いい調子だね！このまま積み上げよう。"; }
    else { face="joe_shock"; say="黒字だけど利益は薄めかも。経費（仕入・人件費）をチェックしてみよう。"; }
  }
  var note = (uriage>0 && jinken<=0) ? '<span class="note">※人件費が未入力です。入力すると利益がより正確になるよ。</span>' : '';
  var f=elt("joe-face"); if(f) f.src="assets/"+face+".png";
  var s=elt("joe-say"); if(s) s.innerHTML=say+note;
}
function renderChannel(t){
  var chs=[
    {n:"券売機", v:t.kenbai, c:"var(--ch1)"},
    {n:"キャッシュレス", v:t.anydeli, c:"var(--ch2)"},  /* anydeli列＝キャッシュレス決済（masa 2026-08-01） */
    {n:"クーポン", v:t.coupon, c:"var(--ch3)"},
    {n:"通販等", v:t.tsuhan, c:"var(--ch4)"}
  ];
  var tot=chs.reduce(function(s,x){return s+x.v;},0)||1;
  elt("channel").innerHTML=chs.map(function(x){
    var p=x.v/tot*100;
    return '<div class="ch-row">'+
      '<div class="ch-head"><span class="ch-dot" style="background:'+x.c+'"></span>'+
      '<span class="ch-name">'+x.n+'</span>'+
      '<span class="ch-val tnum">'+yen(x.v)+'<span class="ch-pct">'+p.toFixed(0)+'%</span></span></div>'+
      '<div class="ch-track"><span class="ch-fill" style="width:'+p.toFixed(1)+'%;background:'+x.c+'"></span></div></div>';
  }).join("");
}

function renderFlash(daily){
  var wd=daily.filter(function(d){return d.uriage>0||d.kyaku>0;});
  var last=wd[wd.length-1];
  if(!last){ elt("flash").innerHTML='<div class="f"><span class="l">データなし</span></div>'; elt("flash-h").textContent="最新日の速報"; return; }
  elt("flash-h").textContent=last.date.slice(5).replace("-","/")+"（"+last.dow+"）の速報"+(STORE==="all"?"｜2店合計":"");
  var tanka=last.kyaku>0?last.uriage/last.kyaku:0;
  var split="";
  if(STORE==="all"){
    /* 全店表示のとき「この¥◯◯は何の数字?」となりやすい（masa 2026-08-01）ので店別内訳を添える */
    var pick=function(list){ var hit=null; list.forEach(function(d){ if(d.date===last.date) hit=d; }); return hit; };
    var k=pick(parseDaily(DATA.kaki)), a=pick(parseDaily(DATA.abura));
    var parts=[];
    if(k&&k.uriage>0) parts.push("柿川亭 "+yen(k.uriage));
    if(a&&a.uriage>0) parts.push("アブララボ "+yen(a.uriage));
    if(parts.length) split='<div class="f" style="grid-column:1/-1"><span class="l">内訳</span><span class="v tnum" style="font-size:14px">'+parts.join("　")+'</span></div>';
  }
  elt("flash").innerHTML=
    f("売上",yen(last.uriage))+f("客数",ppl(last.kyaku))+
    f("客単価",yen(tanka))+f("券売機",yen(last.kenbai))+split;
  function f(l,v){ return '<div class="f"><span class="l">'+l+'</span><span class="v tnum">'+v+'</span></div>'; }
}

/* ===== SVGチャート ===== */
function sparkline(vals){
  vals=vals.filter(function(v,i){return true;});
  var w=280,h=34,mx=Math.max.apply(null,vals.concat([1]));
  var n=vals.length; if(n<2) return "";
  var pts=vals.map(function(v,i){ return (i/(n-1)*w).toFixed(1)+","+(h-v/mx*h).toFixed(1); }).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="height:34px"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function lineChart(daily){
  var W=520,H=180,pad={l:44,r:10,t:12,b:22};
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var vals=daily.map(function(d){return d.uriage;});
  var mx=Math.max.apply(null,vals.concat([1])); mx=Math.ceil(mx/20000)*20000||mx;
  var n=daily.length;
  var X=function(i){ return pad.l + (n<2?0:i/(n-1)*iw); };
  var Y=function(v){ return pad.t + ih - v/mx*ih; };
  /* データのある最終日まででラインを止める（未入力日の0平坦尾を描かない） */
  var lastIdx=-1; for(var k=0;k<n;k++){ if(daily[k].uriage>0) lastIdx=k; } if(lastIdx<0) lastIdx=n-1;
  var line="", area="", g="";
  for(var i=0;i<=lastIdx;i++){ var x=X(i).toFixed(1),y=Y(daily[i].uriage).toFixed(1); line+=(i?"L":"M")+x+" "+y+" "; }
  area="M"+X(0).toFixed(1)+" "+Y(0).toFixed(1)+" "+line.replace(/^M/,"L")+"L"+X(lastIdx).toFixed(1)+" "+Y(0).toFixed(1)+"Z";
  for(var t=0;t<=mx;t+=mx/4){ var y=Y(t).toFixed(1);
    g+='<line class="gridline" x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'"/>';
    g+='<text class="axis" x="'+(pad.l-6)+'" y="'+(+y+3)+'" text-anchor="end">'+(t>=10000?(t/10000)+"万":t)+'</text>'; }
  var xlab="";
  daily.forEach(function(d,i){ var day=+d.date.slice(8); if(day%5===0||i===0){ xlab+='<text class="axis" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+day+'</text>'; } });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="height:190px">'+g+
    '<path d="'+area+'" fill="var(--accent)" opacity="0.10"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    xlab+'</svg>';
}

/* ===== 取得フロー（stale-while-revalidate） ===== */
function applyData(d){ DATA=d; elt("loading").style.display="none"; elt("content").style.display="block"; render(); }
function setSync(state,txt){ var s=elt("sync"); s.classList.toggle("spin",state==="load"); elt("sync-t").textContent=txt; }

function load(force){
  setSync("load","同期中…");
  return fetchMonth(CURRENT).then(function(d){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({at:Date.now(), d:d})); }catch(e){}
    applyData(d);
    var now=new Date(); setSync("ok","更新 "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"));
  }).catch(function(e){
    if(!DATA){ elt("loading").style.display="none"; elt("err").style.display="block";
      elt("err").textContent="データ取得に失敗しました：" + e.message + "（時間をおいて再読み込みしてください）"; }
    setSync("err","同期失敗・再試行");
  });
}

/* ===== 起動 ===== */
(function(){
  // 表情プリロード（切替時のちらつき防止）
  ["joe_happy","joe_glad","joe_worry","joe_shock"].forEach(function(n){ var im=new Image(); im.src="assets/"+n+".png"; });
  // キャッシュ即表示
  try{ var c=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(c&&c.d){ applyData(c.d); setSync("ok","前回の数字を表示中…"); } }catch(e){}
  load();
  setInterval(function(){ if(!document.hidden) load(); }, POLL_MS);
  document.addEventListener("visibilitychange", function(){ /* 非表示中はポーリングしない（intervalでガード） */ });

  // フィルタ
  elt("seg-period").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return;
    PERIOD=b.dataset.period; [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);}); render(); });
  elt("seg-store").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return;
    STORE=b.dataset.store; [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});
    document.documentElement.style.setProperty("--accent", STORE==="abura"?"var(--abura)":"var(--kaki)");
    render(); });
  // 画面切替（下部ナビ）
  elt("bottomnav").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return; showScreen(b.dataset.screen); });
  // 同期ボタン
  elt("sync").addEventListener("click",function(){ load(true); });
  // テーマ
  elt("theme").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next = cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("joe_theme",next);}catch(e){}
  });
  try{ var th=localStorage.getItem("joe_theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
})();
</script>
